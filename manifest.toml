#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "s3manager"
name = "s3manager"
description.en = "A Web GUI for your S3 buckets"
description.fr = "Expliquez en *quelques* (10~15) mots l'utilité de l'app ou ce qu'elle fait (l'objectif est de donner une idée grossière pour des utilisateurs qui naviguent dans un catalogue de 100+ apps)"

version = "0.18.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "free"
code = "https://github.com/cloudlena/s3manager"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"


[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/cloudlena/s3manager/releases/download/v0.13.0/s3manager_0.13.0_linux_amd64.tar.gz"
    sha256 = "c3a5dffb71c7516457a54e138d9a981f5bafdf080a6342853a0a7281aa94191f"

    # autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

